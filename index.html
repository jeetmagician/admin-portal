<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namonamaha Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

:root{
  --ground:#FAF8F6; --surface:#FFFFFF; --surface-2:#F3F0ED; --surface-3:#EAE5E1;
  --ink:#1C1917; --ink-2:#57534E; --ink-3:#8A827C;
  --line:#E4DED8; --line-2:#D1C9C2;
  --accent:#9D2235; --accent-ink:#FFFFFF; --accent-soft:#FBEAED; --accent-line:#E8C4CB;
  --flow:#4338CA; --flow-soft:#EEEFFC; --flow-line:#C9CCF5;
  --ok:#15803D; --ok-soft:#E6F4EB; --ok-line:#BFE0CA;
  --warn:#B45309; --warn-soft:#FBF0E1; --warn-line:#EBD2A9;
  --stop:#B91C1C; --stop-soft:#FBEAEA; --stop-line:#EFC6C6;
  --info:#0369A1; --info-soft:#E6F1F8; --info-line:#BBD8EA;
  --r:10px; --r-sm:6px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(28,25,23,.05),0 4px 14px rgba(28,25,23,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#161413; --surface:#1F1D1B; --surface-2:#292524; --surface-3:#332F2D;
  --ink:#F5F1EE; --ink-2:#B8B0AA; --ink-3:#8A827C;
  --line:#332F2D; --line-2:#453F3C;
  --accent:#E8697F; --accent-ink:#2B0B12; --accent-soft:#33191E; --accent-line:#4E2831;
  --flow:#A5B4FC; --flow-soft:#1F2040; --flow-line:#383A6B;
  --ok:#4ADE80; --ok-soft:#15291D; --ok-line:#28492F;
  --warn:#FBBF24; --warn-soft:#2E2312; --warn-line:#4D3C15;
  --stop:#F87171; --stop-soft:#2E1616; --stop-line:#4D2424;
  --info:#7DD3FC; --info-soft:#12262E; --info-line:#1F4152;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#161413; --surface:#1F1D1B; --surface-2:#292524; --surface-3:#332F2D;
  --ink:#F5F1EE; --ink-2:#B8B0AA; --ink-3:#8A827C;
  --line:#332F2D; --line-2:#453F3C;
  --accent:#E8697F; --accent-ink:#2B0B12; --accent-soft:#33191E; --accent-line:#4E2831;
  --flow:#A5B4FC; --flow-soft:#1F2040; --flow-line:#383A6B;
  --ok:#4ADE80; --ok-soft:#15291D; --ok-line:#28492F;
  --warn:#FBBF24; --warn-soft:#2E2312; --warn-line:#4D3C15;
  --stop:#F87171; --stop-soft:#2E1616; --stop-line:#4D2424;
  --info:#7DD3FC; --info-soft:#12262E; --info-line:#1F4152;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(180deg,rgba(8,6,15,.84),rgba(16,10,20,.88) 60%,rgba(8,6,15,.90)),url('wallpaper.jpg');
  background-position:center,center 22%;background-size:cover,cover;background-repeat:no-repeat,no-repeat;
  background-attachment:fixed,fixed}
@media (max-width:560px){body{background-attachment:scroll,scroll}}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
*:focus-visible{outline:2px solid var(--flow);outline-offset:2px}

/* ---------- chrome (translucent over the wallpaper) ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(20,16,28,.72);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.09)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.02em;white-space:nowrap;color:#F4EFE8}
.brand-logo{height:27px;width:auto;display:block}
.om-mark{font-family:var(--sans);font-weight:600;line-height:1;flex:none;font-size:20px;
  background:linear-gradient(160deg,#F3B267,var(--accent) 55%,#7A1526);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagpill{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--flow);background:var(--flow-soft);border:1px solid var(--flow-line);padding:2px 7px;border-radius:99px;white-space:nowrap}
.top-sp{flex:1 1 auto}
.who{font-size:12.5px;color:#C9C2D8;white-space:nowrap}

.nav{position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:39;background:rgba(20,16,28,.60);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.09);overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-in{display:flex;gap:2px;padding:0 12px;max-width:1180px;margin:0 auto;min-width:max-content}
.nav button{background:none;border:none;border-bottom:2px solid transparent;color:#C9C2D8;padding:11px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav button:hover{color:#F4EFE8}
.nav button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 90px}
/* page headers sit directly on the wallpaper (not inside a white card), so they
   need their own light colors — everything inside .card/.stat keeps the normal
   dark-on-white text untouched. */
.wrap > .eyebrow{color:#B8AFC4}
.wrap > .h-page{color:#F4EFE8}
.wrap > .sub, .wrap > .row > .sub{color:#D8D2E0}
.wrap > .cal > .cal-dow{color:#9C93A8}

/* ---------- primitives (shared with the customer-care portal) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.eyebrow{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:5px}
.h-page{font-size:22px;font-weight:700}
.h-sec{font-size:15px;font-weight:600}
.sub{color:var(--ink-2);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);padding:9px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:13.5px;text-align:center}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.08);background:var(--ok)}
:root[data-theme="dark"] .btn-ok,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-ok{color:#0A1A0F}}
.btn-stop{background:var(--stop-soft);border-color:var(--stop-line);color:var(--stop)}
.btn-stop:hover{background:var(--stop-soft);filter:brightness(1.05)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-wide{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.p-warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.p-stop{color:var(--stop);background:var(--stop-soft);border-color:var(--stop-line)}
.p-info{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.p-flow{color:var(--flow);background:var(--flow-soft);border-color:var(--flow-line)}
.p-mute{color:var(--ink-3);background:var(--surface-2);border-color:var(--line)}

label.f{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;font-size:14px}
.inp:focus{border-color:var(--flow)}
.fld{margin-bottom:12px}
select.inp{appearance:auto}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--ink-2);flex:none}
.kv dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:500;padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.empty{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:13px}
.warnbox{background:var(--warn-soft);border:1px solid var(--warn-line);border-left:3px solid var(--warn);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.warnbox h4{font-size:13px;font-weight:600;color:var(--warn);margin-bottom:5px;font-family:var(--sans)}
.warnbox p{margin:0;font-size:12.5px;color:var(--ink-2)}
.okbox{background:var(--ok-soft);border:1px solid var(--ok-line);border-left:3px solid var(--ok);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.okbox h4{font-size:13px;font-weight:600;color:var(--ok);margin-bottom:5px;font-family:var(--sans)}
.okbox p{margin:0;font-size:12.5px;color:var(--ink-2)}
.stopbox{background:var(--stop-soft);border:1px solid var(--stop-line);border-left:3px solid var(--stop);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.stopbox h4{font-size:13px;font-weight:600;color:var(--stop);margin-bottom:5px;font-family:var(--sans)}
.stopbox p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* ---------- stat tiles ---------- */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.stat .eyebrow{margin-bottom:8px}
.stat .v{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.01em}
.stat .d{font-size:12px;color:var(--ink-3);margin-top:3px}

/* ---------- login ---------- */
.login-wrap{position:relative;min-height:calc(100vh - 20px);display:grid;place-items:center;padding:36px 16px;overflow:hidden;
  background-image:linear-gradient(180deg,rgba(8,6,15,.84),rgba(16,10,20,.88) 60%,rgba(8,6,15,.90)),url('wallpaper.jpg');
  background-position:center,center 22%;background-size:cover,cover;background-repeat:no-repeat,no-repeat;
  background-attachment:fixed,fixed}
@media (max-width:560px){.login-wrap{background-attachment:scroll,scroll}}
.om-mark.lg{position:relative;z-index:1;display:block;text-align:center;font-size:34px;margin:0 0 4px}
.login-card{position:relative;z-index:1;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 30px 80px rgba(0,0,0,.45);padding:30px 26px}
.login-logo{display:block;max-width:220px;width:100%;height:auto;margin:0 auto 6px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.12))}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:38px}
.pw-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;
  background:none;border:none;border-radius:var(--r-sm);color:var(--ink-3);cursor:pointer}
.pw-eye:hover{color:var(--ink-2);background:var(--surface-2)}

/* ---------- credential reveal ---------- */
.cred-box{background:var(--flow-soft);border:1px solid var(--flow-line);border-radius:var(--r-sm);padding:14px;margin-top:6px}
.cred-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.cred-row .cv{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.03em}

/* ---------- roster row ---------- */
.roster{display:flex;flex-direction:column}
.rrow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rrow:last-child{border-bottom:none}
.rrow-main{min-width:0;flex:1 1 260px}
.rrow-name{font-weight:600;font-size:14.5px;font-family:var(--disp)}
.rrow-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.rrow-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ---------- contact icons ---------- */
.contact-icons{display:flex;gap:6px;margin-top:6px}
.icon-btn{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);flex:none;padding:0;appearance:none;cursor:pointer;font:inherit}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn.icon-wa:hover{color:#25D366;border-color:#25D366}
.ad-platform-icon{width:30px;height:30px;border-radius:8px;flex:none;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---------- running indicator (matches the CRM's own running-dot) ---------- */
.running-dot{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft),0 0 12px var(--ok);animation:running-pulse 1.6s ease-in-out infinite;vertical-align:middle}
@keyframes running-pulse{50%{box-shadow:0 0 0 6px var(--ok-soft),0 0 18px var(--ok);opacity:.75}}
.running-word{color:var(--stop);font-weight:700;font-family:var(--mono);font-size:11px;letter-spacing:.04em;vertical-align:middle;margin-right:7px}

/* ---------- days-left countdown box ---------- */
.days-left{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.days-left.urgent{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);font-weight:600}

/* ---------- directory search + A-Z strip ---------- */
.dir-search{max-width:360px;width:100%}
.alpha-strip{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px}
.alpha-btn{min-width:26px;height:26px;padding:0 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font-family:var(--mono);font-size:11px;cursor:pointer;appearance:none}
.alpha-btn:hover{background:var(--surface-3);color:var(--ink)}
.alpha-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.alpha-btn.dim{opacity:.35;cursor:default}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:center;padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1/0.82;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.cal-cell:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.cal-cell.empty2{visibility:hidden;pointer-events:none}
.cal-cell.today{border-color:var(--accent)}
.cal-cell .dn{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.cal-cell .cnt{align-self:flex-start;font-family:var(--mono);font-size:10px;background:var(--flow-soft);color:var(--flow);border:1px solid var(--flow-line);border-radius:99px;padding:1px 6px}
.cal-cell .amt{font-family:var(--mono);font-size:10.5px;color:var(--ok);font-weight:600}
@media (max-width:620px){.cal-cell{padding:4px}.cal-cell .dn{font-size:10.5px}.cal-cell .cnt,.cal-cell .amt{font-size:9px}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:75;display:grid;place-items:center;padding:16px}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,12,10,.62);backdrop-filter:blur(3px)}
.modal-panel{position:relative;width:min(100%,520px);max-height:min(92vh,900px);display:flex;flex-direction:column;background:var(--ground);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.28);overflow:hidden}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.modal-content{padding:18px;overflow-y:auto;min-height:0}
body.modal-open{overflow:hidden}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--ground);border-radius:var(--r-sm);padding:10px 16px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.25);text-align:center}
.toast-stop{background:var(--stop);color:#fff}
:root[data-theme="dark"] .toast,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--surface-3);color:var(--ink)}}

@media (max-width:560px){
  .h-page{font-size:19px}
}

/* ---------- desktop scale-up ---------- */
@media (min-width:900px){
  body{font-size:15.5px}
  .wrap{max-width:min(94vw,1600px);padding:32px 32px 110px}
  .top-in,.nav-in{max-width:min(94vw,1600px)}
  .top-in{padding:14px 28px}
  .nav-in{padding:0 28px}
  .brand{font-size:17px;gap:11px}
  .brand-logo{height:32px}
  .om-mark{font-size:23px}
  .who{font-size:13.5px}
  .nav button{padding:14px 18px;font-size:14.5px}
  .h-page{font-size:29px}
  .h-sec{font-size:17.5px}
  .eyebrow{font-size:11.5px;letter-spacing:.12em}
  .sub{font-size:14.5px}
  .card{padding:22px 24px}
  .card+.card{margin-top:16px}
  .stat{padding:22px 24px}
  .stat .v{font-size:30px}
  .stat .d{font-size:13px}
  .stat .eyebrow{margin-bottom:10px}
  .grid{gap:16px}
  .btn{padding:11px 20px;font-size:15px}
  .btn-sm{padding:8px 15px;font-size:14px}
  table.t{font-size:14.5px}
  table.t th{font-size:11.5px;padding:11px 14px}
  table.t td{padding:13px 14px}
  .inp{padding:12px 14px;font-size:15.5px}
  label.f{font-size:13.5px}
  .fld{margin-bottom:16px}
  .login-card{max-width:460px;padding:42px 38px}
  .login-card .h-page{font-size:27px}
  .rrow{padding:16px 0}
  .rrow-name{font-size:16.5px}
  .rrow-meta{font-size:13.5px;gap:14px}
  .rrow-actions .btn{padding:9px 16px;font-size:13.5px}
  .kv{font-size:14px;padding:9px 0}
  .pill{font-size:11px;padding:4px 10px;letter-spacing:.08em}
  .cal-cell{padding:10px}
  .cal-cell .dn{font-size:14px}
  .cal-cell .cnt{font-size:11.5px;padding:2px 8px}
  .cal-cell .amt{font-size:12px}
  .cal-dow{font-size:11px;padding:6px 0}
  .stat{padding:24px}
}

/* ---------- large desktop / full-screen monitors ---------- */
@media (min-width:1440px){
  body{font-size:17px}
  .wrap{max-width:min(94vw,1900px);padding:40px 40px 120px}
  .top-in,.nav-in{max-width:min(94vw,1900px)}
  .top-in{padding:16px 36px}
  .nav-in{padding:0 36px}
  .brand{font-size:18px}
  .brand-logo{height:34px}
  .who{font-size:14.5px}

/* ==========================================================================
   NAMONAMAHA ADMIN PORTAL — operating prototype
   Single-owner console: income, advertising, temples, and the agents and
   pandits who work the pujas. All data is seeded and kept in localStorage.
   All payments and messages are simulated — nothing here moves real money
   or sends a real WhatsApp/SMS. Credentials generated here are for the
   prototype only.
   ========================================================================== */
const DAY=86400000;
const INR = n => '₹' + Number(Math.round(n||0)).toLocaleString('en-IN');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fmtDateTime = iso => new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});

/* ---------------- admin login (prototype) ---------------- */
const ADMIN_CREDENTIALS = {id:'admin', password:'Namonamaha@2026'};

/* ---------------- ID / password generation ---------------- */
const genId = (prefix, existingIds) => {
  let id;
  do { id = prefix + '-' + Math.floor(1000 + Math.random()*9000); } while (existingIds.includes(id));
  return id;
};
// e.g. name "Suranjeet" + mobile "7004518295" -> "sura7004"
const genPasswordFromNameMobile = (name, mobile) => {
  const letters = (name||'').replace(/[^a-zA-Z]/g,'').toLowerCase();
  const namePart = (letters.slice(0,4) || 'user').padEnd(4,'x');
  const digits = (mobile||'').replace(/\D/g,'');
  const phonePart = (digits.slice(0,4) || '0000').padEnd(4,'0');
  return namePart + phonePart;
};

/* ---------------- agent payout rule (prototype) ---------------- */
const AGENT_COMMISSION = 500; // flat payout per completed pooja handled by the agent

/* ---------------- booking types (mirrors the CRM's own in_person/subscription/online modes) ---------------- */

  in_person:   {label:'Offline puja', pill:'p-mute'},
  online:      {label:'Online puja', pill:'p-info'},
  subscription:{label:'Subscription', pill:'p-flow'}
};
const BOOKING_MODE_KEYS = Object.keys(BOOKING_TYPES);
function bookingTypeTag(mode){
  const t=BOOKING_TYPES[mode];

}

/* ---------------- payout simulation ----------------
   Stands in for a real payout gateway (e.g. RazorpayX Payouts). A real
   backend would call the gateway here, hold the payment as "processing",
   and only mark it paid once a webhook confirms success — a transfer can
   fail (no bank details, bank downtime, a bad IFSC, a payout limit) and
   that must be visible, not silently treated as paid. */
const PAYOUT_FAIL_RATE = 0.2;
const PAYOUT_FAIL_REASONS = [
  'Bank server unavailable — try again in a few minutes.',
  'Payout could not be verified by the bank. Check the account number and IFSC.',
  'Daily payout limit exceeded for this account.'
];
function attemptPayout(a){
  if(!a.bank || !a.bank.accNo) return {status:'failed', reason:'No bank account on file for this agent. Add bank details first.'};
  if(Math.random() < PAYOUT_FAIL_RATE) return {status:'failed', reason:PAYOUT_FAIL_REASONS[Math.floor(Math.random()*PAYOUT_FAIL_REASONS.length)]};
  return {status:'success'};
}

const mod = (n,m) => ((n%m)+m)%m;
function seedPoojas(){
  const out=[];
  const start=-20, end=15; // days relative to today
  let n=1;
  for(let d=start; d<=end; d++){
    const nPerDay = (Math.abs(d*7)%3===0) ? 2 : 1; // uneven spread, deterministic
    for(let k=0;k<nPerDay;k++){
      const date=new Date(Date.now()+d*DAY).toISOString().slice(0,10);
      const temple=SEED_TEMPLES[mod(d+k+4, SEED_TEMPLES.length)];
      const agent=SEED_AGENTS[mod(d+k+1, SEED_AGENTS.length)];
      const pandit=SEED_PANDITS[mod(d+k+2, SEED_PANDITS.length)];
      const devotee=DEVOTEES[mod(d+k+5, DEVOTEES.length)];
      const hour=8+mod(d+k,10), minute=mod((d+k)*17,60);
      out.push({
        id:'PJ-'+String(1000+n), date, templeId:temple.id,
        puja:PUJA_NAMES[mod(d+k+3, PUJA_NAMES.length)],
        devotee:devotee.name, devoteeMobile:devotee.mobile,
        agentId:agent.id, panditId:pandit.id,
        amount: 3000 + ((Math.abs(d*13+k*7))%9)*1000,
        timeLabel: new Date(2000,0,1,hour,minute).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}),
        mode: BOOKING_MODE_KEYS[mod(d+k+6, BOOKING_MODE_KEYS.length)]
      });
      n++;
    }
  }
  return out;
}

  });
  if(changed) saveStore();
})();
// Keep a rolling one-year window: prune poojas older than that on every load,
// so old records age out day by day rather than accumulating forever.
(function pruneOldPoojas(){
  const cutoff=new Date(Date.now()-POOJA_RETENTION_DAYS*DAY).toISOString().slice(0,10);
  const before=DB.poojas.length;
  DB.poojas=DB.poojas.filter(pj=>pj.date>=cutoff);
  if(DB.poojas.length!==before) saveStore();
})();

/* ---------------- helpers ---------------- */
function temple(id){ return DB.temples.find(t=>t.id===id); }
function agent(id){ return DB.agents.find(a=>a.id===id); }
function pandit(id){ return DB.pandits.find(p=>p.id===id); }
function isCompleted(pj){ return pj.date < todayISO(); }
function agentEarned(agentId){
  return DB.poojas.filter(pj=>pj.agentId===agentId && isCompleted(pj)).length * AGENT_COMMISSION;
}

/* ---------------- live bookings from the customer care portal ----------------
   Same origin, so we can read the CRM's own localStorage snapshot directly.
   A booking only counts as a real, live pooja once an onsite agent is
   assigned — without one the pooja can't happen at all, so advance
   payment alone isn't enough to show it here. The pandit is assigned
   later by that same agent (known for certain only once the closing OTP
   comes back), so a blank Pandit on a Live row is expected; a blank
   Agent on a Live row would not be. It shows up here with the real
   devotee phone number they entered — no separate sync step needed, just
   re-read on render (and on a storage event, so another open tab updates
   this one live). Temple/agent/pandit names are resolved from the CRM's
   own reference data (its roster is independent of this portal's own
   Agents/Pandits/Temples), not looked up against DB.temples/agents/
   pandits — and these bookings are shown only in Daily pooja and
   Devotees; they intentionally don't feed Overview income or agent
   payouts, which stay scoped to this portal's own seeded/added data. */
const CRM_STORAGE_KEY = 'namonamaha-care-demo-v15'; // bump this if the CRM's own STORAGE_KEY changes again
function loadCrmSnapshot(){
  try{ return JSON.parse(localStorage.getItem(CRM_STORAGE_KEY)||'null'); }catch(e){ return null; }
}
function crmDerivedPoojas(){
  const crm = loadCrmSnapshot();
  if(!crm || !crm.DB || !Array.isArray(crm.DB.bookings)) return [];
  const findBy = (arr,id) => (arr||[]).find(x=>x.id===id);
  return crm.DB.bookings
    .filter(b => b.advancePaid && b.agentId && b.status!=='CANCELLED' && b.devotee && b.devotee.phone)
    .map(b => {
      const t=findBy(crm.TEMPLES,b.templeId), pj=findBy(crm.PUJAS,b.pujaId),
            ag=findBy(crm.AGENTS,b.agentId), pd=findBy(crm.PANDITS,b.pandaId);
      return {
        id:'CRM-'+b.id, source:'crm', date:new Date(b.pujaAt).toISOString().slice(0,10),
        timeLabel:new Date(b.pujaAt).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}),
        templeName:t?t.name:'—', puja:pj?pj.name:'—',
        devotee:b.devotee.name, devoteeMobile:b.devotee.phone,
        agentName:ag?ag.name:null, agentMobile:ag?ag.phone:null, agentId:ag?ag.id:null,
        panditName:pd?pd.name:null, panditMobile:pd?pd.phone:null, panditId:pd?pd.id:null,
        amount:b.amount, fullyPaid:!!b.balancePaid,
        advanceAmt:b.advanceAmt, balanceAmt:b.balanceAmt,
        mode:b.mode, running: !!b.startedAt && !b.otpVerified
      };
    });
}
function toast(msg, kind){
  const t=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast'+(kind==='stop'?' toast-stop':''); el.textContent=msg;
  t.appendChild(el);
  setTimeout(()=>el.remove(), kind==='stop'?4600:3200);
}

/* ---------------- OVERVIEW ---------------- */
function overviewScreen(){
  const completed = DB.poojas.filter(isCompleted);
  const totalIncome = completed.reduce((s,pj)=>s+pj.amount,0);
  const monthIncome = completed.filter(pj=>pj.date.slice(0,7)===todayISO().slice(0,7)).reduce((s,pj)=>s+pj.amount,0);
  const upcomingValue = DB.poojas.filter(pj=>!isCompleted(pj)).reduce((s,pj)=>s+pj.amount,0);
  const pendingPayouts = DB.agents.reduce((s,a)=>s+Math.max(0, agentEarned(a.id)-a.paid),0);

  const byTemple = DB.temples.map(t=>({
    t, amount: completed.filter(pj=>pj.templeId===t.id).reduce((s,pj)=>s+pj.amount,0),
    count: completed.filter(pj=>pj.templeId===t.id).length
  })).sort((a,b)=>b.amount-a.amount);

  return '<div class="eyebrow">Overview</div><h1 class="h-page">Namonamaha, at a glance</h1>'+
   '<p class="sub" style="margin:6px 0 16px">Income is counted once a pooja\'s date has passed. All figures are from the seeded prototype data.</p>'+
   '<div class="grid g4">'+
    stat('Total income','from completed poojas',INR(totalIncome))+
    stat('This month','completed so far',INR(monthIncome))+
    stat('Upcoming bookings','not yet income',INR(upcomingValue))+
    stat('Pending agent payouts','across '+DB.agents.length+' agents',INR(pendingPayouts))+
   '</div>'+
   '<div class="card" style="margin-top:14px">'+
    '<div class="h-sec" style="margin-bottom:10px">Income by temple</div>'+
    '<div class="scroll-x"><table class="t"><thead><tr><th>Temple</th><th>City</th><th>Completed poojas</th><th>Income</th></tr></thead><tbody>'+
     byTemple.map(r=>'<tr><td><b>'+esc(r.t.name)+'</b></td><td>'+esc(r.t.city)+'</td><td class="mono">'+r.count+'</td><td class="mono">'+INR(r.amount)+'</td></tr>').join('')+
    '</tbody></table></div>'+
   '</div>'+
   '<div class="grid g3" style="margin-top:14px">'+
    quickCard('Daily pooja','Date-wise bookings, click any day to see what ran.','pooja')+
    quickCard('Agent payments','All agent contact, bank details and payouts.','agents')+
    quickCard('Customer care portal','Open the CRM used by care, agents and pandits.','care')+
   '</div>';
}

function poojaTemple(pj){ return pj.source==='crm' ? pj.templeName : (temple(pj.templeId)?temple(pj.templeId).name:'—'); }
function poojaAgent(pj){ return pj.source==='crm' ? {name:pj.agentName, mobile:pj.agentMobile, id:pj.agentId} : agent(pj.agentId); }
function poojaPandit(pj){ return pj.source==='crm' ? {name:pj.panditName, mobile:pj.panditMobile, id:pj.panditId} : pandit(pj.panditId); }

  return (p&&p.name)?esc(p.name)+(p.id?'<div class="sub mono" style="font-size:11px;margin-top:2px">'+esc(p.id)+'</div>':'')+contactIcons(p.name,p.mobile):'—';

function livePill(){ return ' <span class="pill p-flow" title="A real booking, read live from the customer care portal — not just a demo record" style="margin-left:4px">Real booking</span>'; }
// A pooja is "running" the same way the CRM itself defines it: the pandit or
// agent has started it (startedAt set) and it hasn't been closed with the
// completion OTP yet. Only real CRM bookings carry that start/stop event —
// seeded/demo poojas have no such event to check, so they're never "running".
function isPoojaRunning(pj){ return pj.source==='crm' && !!pj.running; }
function runningIndicator(){ return '<span class="running-dot" aria-label="Pooja running"></span><span class="running-word">RUNNING</span> '; }
// Distinct from "Live" (which only means "real, synced data") — this says
// whether the pooja is actually clear to proceed: the balance must be fully
// paid first, so a booking with anything still due cannot have started yet
// no matter how soon its date/time is.
function poojaStatusTag(pj){
  const pay=poojaPayments(pj);
  if(pay.due>0) return ' <span class="pill p-warn" title="Balance still due — the pooja cannot start until it\'s fully paid">Awaiting balance</span>';
  if(isPoojaRunning(pj)) return ''; // the green dot + RUNNING word next to the name already says this
  return isCompleted(pj) ? ' <span class="pill p-ok">Completed</span>' : ' <span class="pill p-info">Ready — fully paid</span>';
}
// Day-count countdown shown under the devotee's name. Uses UTC-normalized
// date math on the plain 'YYYY-MM-DD' strings so it's not thrown off by the
// browser's local timezone.
function daysBetween(fromISO, toISO){
  const [fy,fm,fd]=fromISO.split('-').map(Number), [ty,tm,td]=toISO.split('-').map(Number);
  return Math.round((Date.UTC(ty,tm-1,td)-Date.UTC(fy,fm-1,fd))/DAY);
}
function daysLeftBadge(dateISO){
  const diff=daysBetween(todayISO(), dateISO);
  if(diff<0) return ''; // already past — the status tag covers that
  const label = diff===0 ? 'Today' : diff===1 ? '1 day left' : diff+' days left';
  return '<div class="days-left'+(diff<=3?' urgent':'')+'">'+esc(label)+'</div>';
}
// Payment breakdown for the Devotees directory. CRM bookings pay in two real
// stages (a ~20% advance, then the balance) with live advancePaid/balancePaid
// flags. Seeded/demo poojas carry no staged-payment data of their own, so
// they're shown the same way any real booking looks before the balance is
// paid: only the notional 20% advance is in, the rest is due. Either way,
// Full payment and Total stay blank until the balance actually clears —
// Total only ever shows the full pooja rate once nothing is left due.
function poojaPayments(pj){
  const rate=pj.amount;
  const advance = pj.source==='crm' ? (pj.advanceAmt||0) : Math.round(rate*0.2);
  const balance = pj.source==='crm' ? (pj.balanceAmt||0) : (rate-advance);
  const fullyPaid = pj.source==='crm' ? !!pj.fullyPaid : false;
  return {
    rate, advance,
    due: fullyPaid ? 0 : balance,
    full: fullyPaid ? balance : 0,
    total: fullyPaid ? rate : 0
  };
}

/* ---------------- CSV export ---------------- */
function csvCell(v){
  const s=String(v==null?'':v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(filename, rows){
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function bookingsToCSV(list){
  const header=['Devotee','Phone','Booking type','Pooja','Pooja ID','Temple','Agent','Agent ID','Pandit','Pandit ID',
    'Pooja rate','Advance payment','Due','Full payment','Total','Payment status','Date','Time','Source'];
  const body=list.map(pj=>{
    const pay=poojaPayments(pj), ag=poojaAgent(pj), pd=poojaPandit(pj);
    return [pj.devotee, pj.devoteeMobile, (BOOKING_TYPES[pj.mode]||{}).label||pj.mode||'', pj.puja, pj.id, poojaTemple(pj),
      ag&&ag.name||'', ag&&ag.id||'', pd&&pd.name||'', pd&&pd.id||'',
      pay.rate, pay.advance, pay.due, pay.full, pay.total, pay.due>0?'Due':'Fully paid',
      pj.date, pj.timeLabel||'', pj.source==='crm'?'Live':'Seed'];
  });
  return [header, ...body];
}

function devoteesFilteredRows(){
  const cutoff=new Date(Date.now()-POOJA_RETENTION_DAYS*DAY).toISOString().slice(0,10);
  const q=S.devoteesSearch, letter=S.devoteesLetter;
  let rows=allDailyPoojas().filter(pj=>{
    if(pj.date<cutoff) return false;
    if(!matchesLetter(pj.devotee, letter)) return false;
    if(S.devoteesType && pj.mode!==S.devoteesType) return false;
    if(S.devoteesFrom && pj.date<S.devoteesFrom) return false;
    if(S.devoteesTo && pj.date>S.devoteesTo) return false;
    if(S.devoteesPayStatus){
      const due=poojaPayments(pj).due;
      if(S.devoteesPayStatus==='due' && !(due>0)) return false;
      if(S.devoteesPayStatus==='paid' && due>0) return false;
    }
    const ag=poojaAgent(pj), pd=poojaPandit(pj);
    return matchesQuery([pj.devotee,pj.devoteeMobile,pj.id,pj.puja,
      ag&&ag.name, ag&&ag.mobile, ag&&ag.id, pd&&pd.name, pd&&pd.mobile, pd&&pd.id, poojaTemple(pj)], q);
  });
  return rows.slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
}

/* ---------------- actions ---------------- */
function doLogin(){
  const id=(document.getElementById('li')||{}).value||'';
  const pw=(document.getElementById('lp')||{}).value||'';
  if(id.trim()===ADMIN_CREDENTIALS.id && pw===ADMIN_CREDENTIALS.password){
    setLoggedIn(true); S.route='overview'; S.loginError=null; S.loginDraft=''; S.pwDraft=''; S.pwShow=false;
  }else{
    S.loginDraft=id; S.pwDraft=pw; S.loginError='Incorrect login ID or password.';
  }
  render();
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.getAttribute('data-act');
  const v=el.getAttribute('data-v');

  if(act==='login') return doLogin();
  if(act==='toggle-pw'){
    S.loginDraft=(document.getElementById('li')||{}).value||'';
    S.pwDraft=(document.getElementById('lp')||{}).value||'';
    S.pwShow=!S.pwShow;
    return render();
  }
  if(act==='logout'){
    setLoggedIn(false); S.route='login'; S.modal=null;
    S.loginDraft=''; S.pwDraft=''; S.pwShow=false; S.loginError=null;
    return render();
  }
  if(act==='go'){ S.route=el.getAttribute('data-go'); S.modal=null; return render(); }

  if(act==='cal-prev'){ S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} return render(); }
  if(act==='cal-next'){ S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} return render(); }
  if(act==='cal-today'){ const n=new Date(); S.calYear=n.getFullYear(); S.calMonth=n.getMonth(); return render(); }
  if(act==='cal-open'){ S.calSelected=v; return render(); }
  if(act==='cal-back'){ S.calSelected=null; return render(); }

  if(act==='letter-filter'){
    const section=el.getAttribute('data-section'), letter=el.getAttribute('data-v')||null;
    const key=section+'Letter';
    S[key] = letter ? (S[key]===letter ? null : letter) : null;
    return render();
  }
  if(act==='set-filter'){
    const section=el.getAttribute('data-section'), key=el.getAttribute('data-key'), val=el.getAttribute('data-v')||null;
    S[section+key] = val;
    return render();
  }
  if(act==='devotees-clear-filters'){
    S.devoteesSearch=''; S.devoteesLetter=null; S.devoteesType=null; S.devoteesPayStatus=null;
    S.devoteesFrom=''; S.devoteesTo='';
    return render();
  }

  if(act==='open-modal'){ S.modal={type:v, id:el.getAttribute('data-id')}; return render(); }
  if(act==='close-modal'){ S.modal=null; return render(); }

  if(act==='submit-add-agent'){
    const name=(document.getElementById('m-name')||{}).value.trim();
    const mobile=(document.getElementById('m-mobile')||{}).value.trim();
    if(!name||!mobile) return toast('Enter a name and mobile number.');
    const rec={id:genId('AG', DB.agents.map(a=>a.id)), password:genPasswordFromNameMobile(name, mobile), name, mobile, whatsapp:mobile,
      bank:{accNo:'',ifsc:'',bankName:''}, paid:0, createdAt:todayISO(), payments:[]};
    DB.agents.push(rec); saveStore();
    S.modal={type:'agentCreds', rec};
    return render();
  }
  if(act==='submit-add-pandit'){
    const name=(document.getElementById('m-name')||{}).value.trim();
    const mobile=(document.getElementById('m-mobile')||{}).value.trim();
    if(!name||!mobile) return toast('Enter a name and mobile number.');
    const rec={id:genId('PD', DB.pandits.map(p=>p.id)), password:genPasswordFromNameMobile(name, mobile), name, mobile, createdAt:todayISO()};
    DB.pandits.push(rec); saveStore();
    S.modal={type:'panditCreds', rec};
    return render();
  }
  if(act==='submit-add-temple'){
    const name=(document.getElementById('m-tname')||{}).value.trim();
    const city=(document.getElementById('m-tcity')||{}).value.trim();
    if(!name||!city) return toast('Enter a temple name and city.');
    DB.temples.push({id:genId('TMP', DB.temples.map(t=>t.id)), name, city}); saveStore();
    S.modal=null; toast('Temple added.');
    return render();
  }
  if(act==='delete-temple'){
    if(!confirm('Delete this temple? This cannot be undone.')) return;
    DB.temples=DB.temples.filter(t=>t.id!==v); saveStore();
    return render();
  }
  if(act==='submit-add-ad'){
    const platform=(document.getElementById('m-plat')||{}).value;
    const title=(document.getElementById('m-title')||{}).value.trim();
    const url=(document.getElementById('m-url')||{}).value.trim();
    if(!title||!url) return toast('Enter a title and URL.');
    DB.ads.push({id:genId('AD', DB.ads.map(a=>a.id)), platform, title, url, addedAt:todayISO()}); saveStore();
    S.modal=null; toast('Advertisement added.');
    return render();
  }
  if(act==='delete-ad'){
    DB.ads=DB.ads.filter(a=>a.id!==v); saveStore();
    return render();
  }
  if(act==='delete-agent'){
    if(!confirm('Delete this agent? This cannot be undone.')) return;
    DB.agents=DB.agents.filter(a=>a.id!==v); saveStore();
    return render();
  }
  if(act==='delete-pandit'){
    if(!confirm('Delete this pandit? This cannot be undone.')) return;
    DB.pandits=DB.pandits.filter(p=>p.id!==v); saveStore();
    return render();
  }
  if(act==='submit-edit-bank'){
    const a=agent(v);
    a.whatsapp=(document.getElementById('m-wa')||{}).value.trim();
    a.bank={
      bankName:(document.getElementById('m-bank')||{}).value.trim(),
      accNo:(document.getElementById('m-acc')||{}).value.trim(),
      ifsc:(document.getElementById('m-ifsc')||{}).value.trim()
    };
    saveStore(); S.modal=null; toast('Bank details saved.');
    return render();
  }
  if(act==='submit-pay-agent'){
    const a=agent(v);
    const amount=Math.round(Number((document.getElementById('m-payamt')||{}).value));
    if(!amount || amount<=0) return toast('Enter an amount to pay.');
    const result=attemptPayout(a);
    (a.payments=a.payments||[]).push({amount, at:new Date().toISOString(), status:result.status, reason:result.reason||null});
    if(result.status==='success') a.paid+=amount;
    saveStore();
    S.modal=null;
    if(result.status==='success'){
      toast('Paid '+INR(amount)+' to '+a.name+' (simulated).');
    }else{
      toast('Payment of '+INR(amount)+' to '+a.name+' failed — '+result.reason, 'stop');
    }
    return render();
  }
  if(act==='send-agent'){
    const a=agent(v);
    toast('Payment notification sent to '+a.name+' via WhatsApp (simulated).');
    return;
  }
  if(act==='submit-export-bookings'){
    const from=(document.getElementById('exp-from')||{}).value||'';
    const to=(document.getElementById('exp-to')||{}).value||'';
    const origFrom=S.devoteesFrom, origTo=S.devoteesTo;
    S.devoteesFrom=from; S.devoteesTo=to;
    const rows=devoteesFilteredRows();
    S.devoteesFrom=origFrom; S.devoteesTo=origTo;
    if(!rows.length){ toast('No bookings match that range to export.', 'stop'); return; }
    const stamp=(from||to)?(from||'start')+'_to_'+(to||'end'):'all';
    downloadCSV('namonamaha-bookings-'+stamp+'.csv', bookingsToCSV(rows));
    S.modal=null;
    toast('Exported '+rows.length+' booking'+(rows.length===1?'':'s')+' to CSV.');
    return render();
  }
  if(act==='masked-call'){
    const name=el.getAttribute('data-name');
    toast('Connecting an internet call to '+name+' (simulated) — both numbers stay masked, routed via a provider like Exotel or Knowlarity.');
    return;
  }
  if(act==='show-creds'){
    const kind=el.getAttribute('data-kind');
    S.modal={type:'showCreds', id:v, kind};
    return render();
  }

  if(act==='care-login-pw-toggle'){ S.careLoginPwShow=!S.careLoginPwShow; return render(); }
  if(act==='care-login-edit-start'){ S.careLoginEdit=true; return render(); }
  if(act==='care-login-cancel'){ S.careLoginEdit=false; return render(); }
  if(act==='care-login-save'){
    const id=(document.getElementById('cc-id')||{}).value.trim();
    const password=(document.getElementById('cc-pw')||{}).value.trim();
    if(!id||!password) return toast('Enter a login ID and password.');
    CARE_LOGIN={id,password}; saveCareLogin(CARE_LOGIN);
    S.careLoginEdit=false; S.careLoginPwShow=false;
    toast('Customer care login updated.');
    return render();
  }
});

document.addEventListener('change', e=>{
  const el=e.target.closest('[data-changeact]');
  if(!el) return;
  const act=el.getAttribute('data-changeact');
  if(act==='cal-set-month'){ S.calMonth=Number(el.value); return render(); }
  if(act==='cal-set-year'){ S.calYear=Number(el.value); return render(); }
  if(act==='devotees-from'){ S.devoteesFrom=el.value; return render(); }
  if(act==='devotees-to'){ S.devoteesTo=el.value; return render(); }
});

// Live update: if the customer care portal (open in another tab) saves a
// new booking/payment, its localStorage write fires a 'storage' event here
// so Daily pooja reflects it without needing a manual refresh.
window.addEventListener('storage', e=>{
  if(e.key===CRM_STORAGE_KEY && isLoggedIn()) render();
});

// Live directory search: re-render on every keystroke to filter, but restore
// focus and cursor position afterward since render() rebuilds the DOM node.
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-searchact]');
  if(!el) return;
  const section=el.getAttribute('data-searchact');
  S[section+'Search']=el.value;
  const id=el.id, caret=el.selectionStart;
  render();
  const again=document.getElementById(id);
  if(again){ again.focus(); try{ again.setSelectionRange(caret,caret); }catch(err){} }
});

render();
</script>
</body>
</html>
